<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poetry Generator</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(to right, #ffe3e3, #ffd6d6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      background-color: #fff8f0;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 600px;
    }

    h1 {
      color: #c94c4c;
    }

    select {
      padding: 10px;
      font-size: 16px;
      margin: 20px 0;
      border-radius: 8px;
    }

    .poem-box {
      margin-top: 20px;
      padding: 20px;
      background-color: #fff0f0;
      border-radius: 10px;
      font-style: italic;
      font-size: 18px;
      color: #333;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 Poetry Generator 🌸</h1>
    <label for="language">Select Language:</label>
    <select id="language" onchange="showPoem()">
      <option value="">--Choose--</option>
      <option value="english">English</option>
      <option value="hindi">Hindi</option>
    </select>
    <div id="poem" class="poem-box"></div>
  </div>

  <script>
    const poems = {
      english: [
        `Roses are red,\nViolets are blue,\nSugar is sweet,\nAnd so are you.`,
        `In the still of night,\nStars whisper tales of moonlight,\nDreams take gentle flight.`,
        `Hope is the thing with feathers,\nThat perches in the soul,\nAnd sings the tune without the words,\nAnd never stops at all.`,
        `The road not taken,\nIs a path that calls to you,\nWith choices in the air,\nAnd dreams that come true.`,
        `I wandered lonely as a cloud,\nThat floats on high o'er vales and hills,\nWhen all at once I saw a crowd,\nA host, of golden daffodils.`
      ],
      hindi: [
        `कुछ तो बात है तेरी बातों में,\nहर शब्द में जादू सा लगता है।\nमन के भावों को छू जाए,\nहर पंक्ति कविता सा लगता है।`,
        `चलो कहीं दूर चलें,\nजहाँ शब्दों की ज़रूरत न हो,\nबस भावनाओं की भाषा बोले,\nऔर खामोशी भी सुकून दे।`,
        `चाँदनी रातों में जब\nतारों से बात होती है,\nहर शेर में कोई\nकहानी सी बात होती है।`,
        `यह वक्त भी हसीन है,\nजो पल में खुशियों के रंग सहेजने हैं,\nकभी जी लो, कभी खो लो,\nकभी अपने को तलाशो।`,
        `तू चाँद सा है,\nजिसके उजालों में खुद को खो जाता हूँ,\nमैं तारे सा हूँ,\nजो तेरी रोशनी में टिमटिमाता हूँ।`
      ]
    };

    function showPoem() {
      const lang = document.getElementById("language").value;
      const poemBox = document.getElementById("poem");
      if (poems[lang]) {
        const poem = poems[lang][Math.floor(Math.random() * poems[lang].length)];
        poemBox.textContent = poem;
      } else {
        poemBox.textContent = '';
      }
    }
  </script>
</body>
</html>
